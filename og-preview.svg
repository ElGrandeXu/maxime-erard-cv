<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Maxime ERARD - CV HTML interactif</title>
  <desc id="desc">Apercu Open Graph du CV HTML interactif de Maxime ERARD, consultant IA generative et workflows open source.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1412"/>
      <stop offset="0.54" stop-color="#17231f"/>
      <stop offset="1" stop-color="#111513"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfa"/>
      <stop offset="1" stop-color="#eef2ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0c1310" flood-opacity="0.18"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#d8ded8" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#f4f6f3"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>
  <path d="M0 0h1200v630H0z" fill="url(#paper)" opacity="0.72"/>

  <rect x="54" y="52" width="1092" height="526" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="54" y="52" width="1092" height="526" rx="22" fill="none" stroke="#d8ded8" stroke-width="1"/>

  <rect x="82" y="80" width="482" height="470" rx="18" fill="url(#hero)"/>
  <path d="M82 420c98-28 169-18 247 26 75 42 144 39 235-10v114H82z" fill="#b04a3f" opacity="0.16"/>
  <circle cx="502" cy="132" r="58" fill="#b04a3f" opacity="0.12"/>
  <circle cx="514" cy="132" r="22" fill="#b04a3f" opacity="0.32"/>

  <text x="120" y="132" fill="#dce5df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.5">CV HTML INTERACTIF</text>
  <text x="120" y="216" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800">Maxime</text>
  <text x="120" y="286" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800">ERARD</text>
  <rect x="120" y="316" width="86" height="5" rx="2.5" fill="#b04a3f"/>
  <text x="120" y="366" fill="#f4f6f3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">Consultant IA generative</text>
  <text x="120" y="404" fill="#f4f6f3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">&amp; workflows open source</text>
  <text x="120" y="462" fill="#b8c5bd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">API . automatisation . production</text>
  <text x="120" y="510" fill="#f4f6f3" font-family="Consolas, Menlo, monospace" font-size="18">public CV . GitHub Pages . no build</text>

