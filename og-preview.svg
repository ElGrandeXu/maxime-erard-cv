    <rect x="0" y="0" width="496" height="42" rx="16" fill="#151a17"/>
    <rect x="0" y="26" width="496" height="16" fill="#151a17"/>
    <circle cx="24" cy="21" r="5" fill="#b04a3f"/>
    <circle cx="44" cy="21" r="5" fill="#d8ded8"/>
    <circle cx="64" cy="21" r="5" fill="#aebbb2"/>
    <text x="96" y="27" fill="#dce5df" font-family="Consolas, Menlo, monospace" font-size="15">index.html</text>

