      <text x="282" y="286" fill="#111513" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Stack</text>
      <text x="282" y="318" fill="#58625d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Python . LLM . APIs</text>
      <rect x="282" y="336" width="88" height="4" rx="2" fill="#b04a3f"/>
