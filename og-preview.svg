  <g transform="translate(640 504)">
    <rect x="0" y="0" width="432" height="46" rx="9" fill="#151a17"/>
    <text x="20" y="29" fill="#dce5df" font-family="Consolas, Menlo, monospace" font-size="17">$ open cv --interactive --public</text>
    <circle cx="396" cy="23" r="6" fill="#b04a3f"/>
