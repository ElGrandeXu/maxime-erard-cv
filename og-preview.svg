    <rect x="32" y="110" width="198" height="10" rx="5" fill="#aebbb2"/>
    <rect x="32" y="130" width="304" height="10" rx="5" fill="#d8ded8"/>
    <rect x="32" y="150" width="256" height="10" rx="5" fill="#d8ded8"/>

