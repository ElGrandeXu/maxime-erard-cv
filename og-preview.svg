      <text x="67" y="205" fill="#7c3029">IA</text>
      <rect x="112" y="190" width="76" height="30" rx="15" fill="#ffffff" stroke="#d8ded8"/>
      <text x="150" y="205" fill="#58625d">API</text>
      <rect x="198" y="190" width="134" height="30" rx="15" fill="#ffffff" stroke="#d8ded8"/>
      <text x="265" y="205" fill="#58625d">Open source</text>
      <rect x="342" y="190" width="112" height="30" rx="15" fill="#ffffff" stroke="#d8ded8"/>
      <text x="398" y="205" fill="#58625d">Produit</text>
    </g>

    <g>
      <rect x="32" y="250" width="204" height="104" rx="10" fill="#ffffff" stroke="#d8ded8"/>
      <text x="54" y="286" fill="#111513" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Projets cles</text>
      <text x="54" y="318" fill="#58625d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">EGX . Asphalte . TEDx</text>
      <rect x="54" y="336" width="112" height="4" rx="2" fill="#b04a3f"/>

