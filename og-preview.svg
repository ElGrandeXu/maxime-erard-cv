<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Maxime ERARD — CV HTML interactif</title>
  <desc id="desc">Aperçu Open Graph du CV HTML interactif de Maxime ERARD, consultant IA générative et workflows open source.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1412"/>
      <stop offset="0.55" stop-color="#17231f"/>
      <stop offset="1" stop-color="#111513"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfa"/>
      <stop offset="1" stop-color="#eef2ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0c1310" flood-opacity="0.18"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#d8ded8" stroke-width="1" opacity="0.42"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#f4f6f3"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>
  <path d="M0 0h1200v630H0z" fill="url(#paper)" opacity="0.72"/>

  <rect x="70" y="70" width="1060" height="490" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="70" y="70" width="1060" height="490" rx="22" fill="none" stroke="#d8ded8" stroke-width="1"/>

  <rect x="100" y="100" width="470" height="450" rx="14" fill="url(#hero)"/>
  <path d="M100 428c96-27 164-17 240 25 73 40 140 38 230-10v107H100z" fill="#b04a3f" opacity="0.16"/>
  <circle cx="510" cy="132" r="57" fill="#b04a3f" opacity="0.11"/>
  <circle cx="522" cy="132" r="22" fill="#b04a3f" opacity="0.32"/>

  <text x="138" y="132" fill="#dce5df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.5">CV HTML INTERACTIF</text>
  <text x="138" y="216" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800">Maxime</text>
  <text x="138" y="286" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800">ERARD</text>
  <rect x="138" y="316" width="86" height="5" rx="2.5" fill="#b04a3f"/>
  <text x="138" y="366" fill="#f4f6f3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">Consultant IA générative</text>
  <text x="138" y="404" fill="#f4f6f3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">&amp; workflows open source</text>
  <text x="138" y="462" fill="#b8c5bd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">API · automatisation · production</text>
  <text x="138" y="510" fill="#f4f6f3" font-family="Consolas, Menlo, monospace" font-size="18">public CV · GitHub Pages · no build</text>

  <g id="right-panel" transform="translate(615 112)">
    <rect x="0" y="0" width="470" height="380" rx="14" fill="#f7f9f6" stroke="#d8ded8"/>
    <rect x="0" y="0" width="470" height="42" rx="14" fill="#151a17"/>
    <rect x="0" y="26" width="470" height="16" fill="#151a17"/>
    <circle cx="24" cy="21" r="5" fill="#b04a3f"/>
    <circle cx="44" cy="21" r="5" fill="#d8ded8"/>
    <circle cx="64" cy="21" r="5" fill="#aebbb2"/>
    <text x="96" y="27" fill="#dce5df" font-family="Consolas, Menlo, monospace" font-size="15">index.html</text>

    <g id="skeleton">
      <rect x="28" y="72" width="270" height="22" rx="4" fill="#111513"/>
      <rect x="28" y="110" width="198" height="10" rx="5" fill="#aebbb2"/>
      <rect x="28" y="130" width="304" height="10" rx="5" fill="#d8ded8"/>
      <rect x="28" y="150" width="256" height="10" rx="5" fill="#d8ded8"/>
    </g>

    <g id="tags" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="central">
      <rect x="28" y="205" width="74" height="32" rx="16" fill="#f8eeec" stroke="#b04a3f"/>
      <text x="65" y="221" fill="#7c3029">IA</text>
      <rect x="112" y="205" width="82" height="32" rx="16" fill="#ffffff" stroke="#d8ded8"/>
      <text x="153" y="221" fill="#58625d">API</text>
      <rect x="204" y="205" width="130" height="32" rx="16" fill="#ffffff" stroke="#d8ded8"/>
      <text x="269" y="221" fill="#58625d">Open source</text>
      <rect x="344" y="205" width="100" height="32" rx="16" fill="#ffffff" stroke="#d8ded8"/>
      <text x="394" y="221" fill="#58625d">Produit</text>
    </g>

    <g id="cards">
      <rect x="28" y="265" width="195" height="96" rx="10" fill="#ffffff" stroke="#d8ded8"/>
      <text x="50" y="301" fill="#111513" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Projets clés</text>
      <text x="50" y="332" fill="#58625d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">EGX · Asphalte · TEDx</text>
      <rect x="50" y="346" width="112" height="4" rx="2" fill="#b04a3f"/>

      <rect x="245" y="265" width="195" height="96" rx="10" fill="#ffffff" stroke="#d8ded8"/>
      <text x="267" y="301" fill="#111513" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Stack</text>
      <text x="267" y="332" fill="#58625d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Python · LLM · APIs</text>
      <rect x="267" y="346" width="112" height="4" rx="2" fill="#b04a3f"/>
    </g>
  </g>

  <g transform="translate(645 520)">
    <rect x="0" y="0" width="410" height="44" rx="8" fill="#151a17"/>
    <text x="18" y="28" fill="#dce5df" font-family="Consolas, Menlo, monospace" font-size="16">$ open cv --interactive --public</text>
    <circle cx="380" cy="22" r="6" fill="#b04a3f"/>
  </g>
</svg>
